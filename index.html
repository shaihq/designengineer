<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Days of Claude — The Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --background:0 0% 100%;
  --foreground:240 10% 3.9%;
  --card:0 0% 100%;
  --muted:240 4.8% 95.9%;
  --muted-foreground:240 3.8% 46.1%;
  --border:240 5.9% 90%;
  --primary:240 5.9% 10%;
  --primary-foreground:0 0% 98%;
  --accent:240 4.8% 95.9%;
  --ring:240 5% 64.9%;
  --radius:0.75rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:240 10% 3.9%;
    --foreground:0 0% 98%;
    --card:240 6% 7%;
    --muted:240 3.7% 15.9%;
    --muted-foreground:240 5% 64.9%;
    --border:240 3.7% 17%;
    --primary:0 0% 98%;
    --primary-foreground:240 5.9% 10%;
    --accent:240 3.7% 15.9%;
    --ring:240 4.9% 83.9%;
  }
}
:root[data-theme="dark"]{
  --background:240 10% 3.9%;
  --foreground:0 0% 98%;
  --card:240 6% 7%;
  --muted:240 3.7% 15.9%;
  --muted-foreground:240 5% 64.9%;
  --border:240 3.7% 17%;
  --primary:0 0% 98%;
  --primary-foreground:240 5.9% 10%;
  --accent:240 3.7% 15.9%;
  --ring:240 4.9% 83.9%;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:hsl(var(--background));color:hsl(var(--foreground));
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.wrap{
  width:100%;max-width:600px;margin:0 auto;
  padding:1.25rem 1.25rem calc(6.5rem + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:1.1rem;
}

/* progress */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  margin:0 -1.25rem;padding:.9rem 1.25rem .8rem;
  background:hsl(var(--background) / .8);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;flex-direction:column;gap:.55rem;
}
.ticks{display:flex;gap:3px}
.tick{flex:1;height:3px;border-radius:999px;background:hsl(var(--border));transition:background .4s ease}
.tick.done{background:hsl(var(--muted-foreground))}
.tick.now{background:hsl(var(--primary))}
.meta{display:flex;justify-content:space-between;font-size:.75rem;color:hsl(var(--muted-foreground))}
.counter{font-family:'JetBrains Mono',ui-monospace,monospace}

/* card */
.card{
  background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);
  padding:1.5rem 1.25rem;display:flex;flex-direction:column;gap:1rem;
  will-change:filter,opacity,transform;
}
.enter{animation:blurIn .55s cubic-bezier(.22,.61,.36,1) both}
.exit{animation:blurOut .22s cubic-bezier(.55,.06,.68,.19) both}
@keyframes blurIn{from{opacity:0;filter:blur(14px);transform:translateY(12px) scale(.985)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes blurOut{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(10px);transform:translateY(-8px) scale(.99)}}

.kicker{font-size:.8rem;font-weight:500;color:hsl(var(--muted-foreground));margin:0}
h2{margin:0;font-size:1.45rem;line-height:1.2;font-weight:700;letter-spacing:-.022em}
h2.big{font-size:1.85rem;letter-spacing:-.03em;line-height:1.12}
p{margin:0}
.lead{font-size:1rem;color:hsl(var(--foreground))}
.soft{font-size:.9rem;color:hsl(var(--muted-foreground))}

.shot{
  display:block;width:100%;padding:0;border:1px solid hsl(var(--border));
  border-radius:calc(var(--radius) - 2px);overflow:hidden;background:#0b141a;cursor:zoom-in;
}
.shot img{display:block;width:100%;height:auto;max-height:46vh;object-fit:cover;object-position:top}
.shot-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.shot-grid .shot img{max-height:180px}

.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem}
.points li{display:flex;gap:.65rem;font-size:.92rem;line-height:1.5}
.points li::before{content:"";flex:none;width:6px;height:6px;border-radius:999px;margin-top:.55rem;background:hsl(var(--ring))}
.points.divided{border-top:1px solid hsl(var(--border));padding-top:1rem}

.compare{display:grid;grid-template-columns:1fr;gap:.7rem}
.lane{border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);padding:.9rem .85rem 1rem;
  animation:blurIn .5s var(--d,0s) cubic-bezier(.22,.61,.36,1) both}
.lane.new{
  background:radial-gradient(120% 140% at 100% 0%,hsl(258 45% 22%) 0%,transparent 55%),linear-gradient(160deg,hsl(245 28% 13%),hsl(240 22% 8%));
  color:hsl(0 0% 98%);border-color:hsl(250 40% 60% / .18);
  --primary-foreground:0 0% 98%;
}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes glow{0%,100%{box-shadow:0 0 14px hsl(265 90% 65% / .45)}33%{box-shadow:0 0 14px hsl(190 90% 55% / .45)}66%{box-shadow:0 0 14px hsl(320 85% 65% / .45)}}
.lane.new .node.ship{
  border:1.5px solid transparent;
  background:linear-gradient(hsl(250 24% 17%),hsl(250 24% 17%)) padding-box,
    conic-gradient(from var(--a),#8b5cf6,#22d3ee,#34d399,#f472b6,#8b5cf6) border-box;
  animation:blurIn .45s var(--d) cubic-bezier(.22,.61,.36,1) both,spin 3s linear infinite,glow 6s ease-in-out infinite;
}
.lane .label{font-size:.72rem;font-weight:600;opacity:.7;margin-bottom:.6rem}
.track{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;align-items:center;row-gap:0}
.node{
  text-align:center;font-size:.84rem;font-weight:600;padding:.45rem .3rem;border-radius:999px;
  border:1px solid hsl(var(--border));background:hsl(var(--card));white-space:nowrap;
  animation:blurIn .45s var(--d) cubic-bezier(.22,.61,.36,1) both;
}
.lane.new .node{background:hsl(var(--primary-foreground) / .08);border-color:hsl(var(--primary-foreground) / .22)}
.node.stuck{border-style:dashed;color:hsl(var(--muted-foreground));background:transparent}
.node.stuck .dots{display:inline-block;animation:pulse 1.4s calc(var(--d) + .5s) ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.link{width:100%;height:12px;display:block;overflow:visible}
.link .draw{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s var(--d) cubic-bezier(.65,.05,.36,1) forwards}
.link .head{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;animation:appear .18s calc(var(--d) + .3s) forwards}
.lane.old .link{opacity:.5}
.loop{
  grid-column:1 / -1;position:relative;height:14px;
  margin:.55rem calc((100% - 56px) / 6) 0;
  border:1.6px solid currentColor;border-top:none;border-radius:0 0 12px 12px;
  clip-path:inset(-10px -10px -10px 100%);animation:unclip .7s var(--d) cubic-bezier(.65,.05,.36,1) forwards;
}
.loop::after{
  content:"";position:absolute;left:-5.3px;top:-1px;width:8px;height:8px;
  border-left:1.6px solid currentColor;border-top:1.6px solid currentColor;transform:rotate(45deg);
}
.loop-label{
  grid-column:1 / -1;text-align:center;font-size:.72rem;font-weight:600;opacity:0;margin-top:.3rem;
  animation:appear .3s calc(var(--d) + .6s) forwards;
}
.loop-label span{opacity:.75}
@keyframes unclip{to{clip-path:inset(-10px -10px -10px -10px)}}

.session{border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);padding:1rem;display:flex;flex-direction:column;gap:.55rem}
.session h3{margin:0;font-size:1.02rem;font-weight:700;letter-spacing:-.012em;line-height:1.3}
.stack{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.72rem;color:hsl(var(--muted-foreground))}
.session p{font-size:.88rem;color:hsl(var(--muted-foreground))}
.badges{display:flex;flex-wrap:wrap;gap:.35rem}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:600;padding:.2rem .5rem;border-radius:999px;border:1px solid hsl(var(--border));background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.badge.live{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:transparent}
.badge.live::before{content:"";width:5px;height:5px;border-radius:999px;background:currentColor}
.badge.bonus{border-style:dashed}

.stat{display:flex;align-items:baseline;gap:.5rem}
.stat b{font-size:2.6rem;font-weight:700;letter-spacing:-.04em;line-height:1}
.stat span{font-size:.9rem;color:hsl(var(--muted-foreground))}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px)}
table{border-collapse:collapse;width:100%;min-width:440px;font-size:.8rem}
th,td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid hsl(var(--border));vertical-align:top}
th{font-size:.72rem;font-weight:600;color:hsl(var(--muted-foreground));background:hsl(var(--muted))}
tr:last-child td{border-bottom:none}
td.fmt{white-space:nowrap;font-size:.72rem;color:hsl(var(--muted-foreground))}
td.fmt.live{color:hsl(var(--foreground));font-weight:600}
td.name{font-weight:600}
tr.extra td{background:hsl(var(--muted) / .5)}

.pill-marquee{
  display:flex;flex-direction:column;gap:.5rem;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent,black 12%,black 88%,transparent);
  mask-image:linear-gradient(to right,transparent,black 12%,black 88%,transparent);
}
.pill-row{display:flex;gap:.4rem;width:max-content;animation:marquee var(--dur,30s) linear infinite}
.pill-row.reverse{animation-direction:reverse}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pill{
  flex:none;white-space:nowrap;
  font-size:.72rem;font-weight:500;line-height:1.25;padding:.3rem .6rem;border-radius:999px;
  border:1px solid hsl(var(--border));background:hsl(var(--muted));color:hsl(var(--foreground));
}
table.grouped{min-width:0;table-layout:fixed}
table.grouped th:first-child{width:42%}
table.grouped tbody{animation:blurIn .5s var(--d) cubic-bezier(.22,.61,.36,1) both}
table.grouped tr.group td{background:hsl(var(--muted));padding:.55rem .7rem;border-bottom:1px solid hsl(var(--border))}
.gname{display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:700}
.gname.live::before{content:"";width:6px;height:6px;border-radius:999px;background:hsl(var(--foreground))}
.gnote{display:block;font-size:.7rem;color:hsl(var(--muted-foreground));margin-top:.1rem}
table.grouped td{font-size:.76rem;line-height:1.45;color:hsl(var(--muted-foreground))}
table.grouped td.name{color:hsl(var(--foreground));font-weight:600;font-size:.8rem}
.stk{display:block;font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:.64rem;color:hsl(var(--muted-foreground));margin-top:.2rem;word-break:break-word}
.days{display:inline-block;margin-left:.35rem;font-size:.62rem;font-weight:600;padding:.05rem .4rem;border-radius:999px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));vertical-align:1px}
table.grouped thead th{background:hsl(var(--card))}
.hello{display:flex;align-items:center;gap:.25rem;margin-bottom:-.35rem}
.card:has(.hello){gap:.85rem}
.avatar{
  width:52px;height:52px;border-radius:999px;object-fit:cover;flex:none;
  border:1px solid hsl(var(--border));
  animation:blurIn .5s .1s cubic-bezier(.22,.61,.36,1) both;
}
.hello svg{width:46px;height:30px;flex:none;color:hsl(var(--foreground));overflow:visible;margin-top:-.6rem}
.hello svg .draw{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s .45s cubic-bezier(.65,.05,.36,1) forwards}
.hello svg .head{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:appear .2s .95s forwards}
.scrawl{
  font-family:'Caveat','Bradley Hand','Segoe Print',cursive;font-weight:600;font-size:1.75rem;line-height:1;
  transform:rotate(-5deg);margin-top:-1.1rem;display:inline-block;
  animation:blurIn .5s .9s cubic-bezier(.22,.61,.36,1) both;
}
.pricerow{display:flex;flex-direction:column;gap:.5rem}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:calc(var(--radius) - 4px);background:hsl(var(--muted));border:1px solid hsl(var(--border))}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;align-items:center;justify-content:center;height:36px;border-radius:calc(var(--radius) - 6px);
  font-size:.85rem;font-weight:600;color:hsl(var(--muted-foreground));cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
.seg input:checked + label{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:0 1px 2px hsl(240 10% 3.9% / .12)}
.seg input:focus-visible + label{outline:2px solid hsl(var(--ring));outline-offset:1px}
.money{position:relative}
.money .sym{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-weight:600;color:hsl(var(--muted-foreground));pointer-events:none}
.field .money input[type=text]{padding-left:1.9rem;font-variant-numeric:tabular-nums}
.of{font-size:1rem;font-weight:600;color:hsl(var(--muted-foreground));margin-left:.15rem;letter-spacing:0}
.opt{font-weight:500;color:hsl(var(--muted-foreground));font-size:.75rem;margin-left:.25rem}
.field textarea{
  font:inherit;font-size:16px;width:100%;padding:.65rem .8rem;resize:vertical;min-height:84px;
  border-radius:calc(var(--radius) - 4px);border:1px solid hsl(var(--border));
  background:hsl(var(--background));color:hsl(var(--foreground));transition:border-color .15s,box-shadow .15s;
}
.field textarea::placeholder{color:hsl(var(--muted-foreground) / .7)}
.field textarea:focus{outline:none;border-color:hsl(var(--ring));box-shadow:0 0 0 3px hsl(var(--ring) / .25)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.submit:disabled{opacity:.6;cursor:progress}
#formwrap{display:flex;flex-direction:column;gap:1rem}
.form{display:flex;flex-direction:column;gap:1rem;margin-top:.25rem}
.field{display:flex;flex-direction:column;gap:.4rem}
.field label{font-size:.85rem;font-weight:600;line-height:1.35}
.field input[type=text],.field input[type=email],.field input[type=tel]{
  font:inherit;font-size:16px;height:44px;width:100%;padding:0 .8rem;
  border-radius:calc(var(--radius) - 4px);border:1px solid hsl(var(--border));
  background:hsl(var(--background));color:hsl(var(--foreground));
  transition:border-color .15s,box-shadow .15s;
}
.field input::placeholder{color:hsl(var(--muted-foreground) / .7)}
.field input:focus{outline:none;border-color:hsl(var(--ring));box-shadow:0 0 0 3px hsl(var(--ring) / .25)}
.field input[aria-invalid=true]{border-color:hsl(0 72% 51%)}
.err{font-size:.75rem;color:hsl(0 72% 51%);min-height:0}
.err:empty{display:none}
.phone{display:flex;align-items:stretch}
.phone .cc{display:flex;align-items:center;padding:0 .7rem;font-size:.9rem;font-weight:500;
  border:1px solid hsl(var(--border));border-right:none;border-radius:calc(var(--radius) - 4px) 0 0 calc(var(--radius) - 4px);
  background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.phone input{border-radius:0 calc(var(--radius) - 4px) calc(var(--radius) - 4px) 0 !important}
.price{font-size:1.9rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;
  --p:13.8%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;
  background:linear-gradient(to right,hsl(var(--primary)) var(--p),hsl(var(--muted)) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:hsl(var(--muted))}
input[type=range]::-moz-range-progress{height:6px;border-radius:999px;background:hsl(var(--primary))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:999px;
  background:hsl(var(--background));border:2px solid hsl(var(--primary));box-shadow:0 1px 3px hsl(240 10% 3.9% / .2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:999px;background:hsl(var(--background));border:2px solid hsl(var(--primary))}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px hsl(var(--ring) / .35)}
.range-ends{display:flex;justify-content:space-between;font-size:.72rem;color:hsl(var(--muted-foreground));margin-top:-.2rem}
.submit{width:100%;margin-top:.25rem}
.thanks{display:flex;flex-direction:column;gap:.75rem;animation:blurIn .5s cubic-bezier(.22,.61,.36,1) both}
.card:has(.profile){padding:0;overflow:hidden}
.profile{display:flex;flex-direction:column}
.banner{position:relative;aspect-ratio:2.4/1;background:linear-gradient(180deg,#1f6fd1,#3fb3ea);overflow:hidden}
.banner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.pbody{padding:0 1.25rem 1.5rem;display:flex;flex-direction:column;gap:.7rem}
.ring{
  position:relative;width:92px;height:92px;margin-top:-46px;border-radius:999px;
  background:hsl(var(--card));border:4px solid hsl(var(--card));
  box-shadow:0 0 0 1px hsl(var(--border));
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  animation:blurIn .55s .15s cubic-bezier(.22,.61,.36,1) both;
}
.ring .big{font-size:2rem;font-weight:700;letter-spacing:-.04em}
.ring .unit{font-size:.72rem;font-weight:600;color:hsl(var(--muted-foreground));margin-top:.1rem}
.tick-badge{position:absolute;right:-4px;bottom:-2px;width:28px;height:28px;border-radius:999px;
  background:hsl(217 91% 60%);border:3px solid hsl(var(--card));display:flex;align-items:center;justify-content:center;
  animation:pop .35s .6s cubic-bezier(.34,1.56,.64,1) both}
.tick-badge svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.pbody .kicker{margin-top:.2rem}
.bio{font-size:.95rem;line-height:1.55}
.at{color:hsl(217 91% 60%);font-weight:500}
.pstats{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;font-size:.9rem;color:hsl(var(--muted-foreground));padding-top:.2rem}
.pstats b{color:hsl(var(--foreground));font-weight:700}
@media (min-width:600px){.pbody{padding:0 1.5rem 1.75rem}}
.oboxes{display:flex;flex-direction:column;gap:.5rem}
.obox{
  display:flex;gap:.75rem;align-items:flex-start;padding:.8rem .85rem;
  border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);background:hsl(var(--muted) / .6);
  animation:blurIn .55s var(--d) cubic-bezier(.22,.61,.36,1) both;
}
.oico{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:hsl(var(--card));border:1px solid hsl(var(--border))}
.oico svg{width:20px;height:20px;fill:none;stroke:hsl(var(--foreground));stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.oico svg *{stroke-dasharray:80;stroke-dashoffset:80;animation:odraw .9s calc(var(--d) + .25s) cubic-bezier(.65,.05,.36,1) forwards}
@keyframes odraw{to{stroke-dashoffset:0}}
.obox h3{margin:0 0 .15rem;font-size:.93rem;font-weight:700;letter-spacing:-.012em;line-height:1.3}
.obox p{margin:0;font-size:.8rem;line-height:1.4;color:hsl(var(--muted-foreground))}
@media (prefers-reduced-motion: reduce){.obox,.oico svg *{animation:none;stroke-dashoffset:0}}
/* goal paths */
.paths{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:.25rem}
.origin{
  display:inline-flex;align-items:center;gap:.45rem;
  padding:.5rem .9rem;border-radius:999px;font-size:.85rem;font-weight:600;
  border:1px solid hsl(var(--border));background:hsl(var(--muted));
  animation:blurIn .5s .1s cubic-bezier(.22,.61,.36,1) both;
}
.origin::before{content:"";width:7px;height:7px;border-radius:999px;background:hsl(var(--foreground))}
.routes{width:100%;height:auto;display:block;color:hsl(var(--foreground));overflow:visible}
.routes .base{fill:none;stroke:hsl(var(--border));stroke-width:1.5}
.routes .draw{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .55s cubic-bezier(.65,.05,.36,1) forwards}
.routes .draw.r{animation-delay:.75s}
.routes .flow{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;
  stroke-dasharray:1.5 5;opacity:0;animation:appear .3s 1.9s forwards, march 1.4s 1.9s linear infinite}
.routes .head{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;animation:appear .25s 1.55s forwards}
.routes .head.r{animation-delay:1.75s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes march{to{stroke-dashoffset:-13}}
@keyframes appear{to{opacity:1}}
.ends{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%}
.end{
  border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);
  padding:.85rem .8rem;display:flex;flex-direction:column;gap:.35rem;
  animation:blurIn .55s cubic-bezier(.22,.61,.36,1) both;animation-delay:1.6s;
}
.end.r{animation-delay:1.8s}
.end h3{margin:0;font-size:.95rem;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.end p{margin:0;font-size:.8rem;line-height:1.45;color:hsl(var(--muted-foreground))}
.end.solid{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:transparent}
.end.solid p{color:hsl(var(--primary-foreground) / .72)}

/* nav */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  padding:0 1rem calc(1rem + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;pointer-events:none;
}
.nav-inner{
  max-width:600px;width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:.6rem;
  padding:.5rem;border-radius:999px;pointer-events:auto;
  background:hsl(var(--background) / .85);
  border:1px solid hsl(var(--border));
  box-shadow:0 12px 32px hsl(240 10% 3.9% / .16),0 2px 8px hsl(240 10% 3.9% / .08);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
button{font:inherit;cursor:pointer}
.btn{
  flex:none;width:46px;height:46px;padding:0;border-radius:999px;overflow:hidden;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font-size:.92rem;font-weight:600;border:1px solid hsl(var(--border));
  background:hsl(var(--card));color:hsl(var(--foreground));
  transition:opacity .15s,background .15s,width .32s cubic-bezier(.22,.61,.36,1),padding .32s cubic-bezier(.22,.61,.36,1);
}
.btn:hover:not(:disabled){background:hsl(var(--accent))}
.btn:focus-visible,.shot:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:transparent}
.btn.primary:hover{background:hsl(var(--primary));opacity:.9}
.btn.wide{width:136px;padding:0 1rem}

/* lightbox */
.lightbox{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px));
  background:hsl(240 10% 3.9% / .6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);cursor:zoom-out;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .28s cubic-bezier(.22,.61,.36,1),visibility 0s linear .28s;
}
.lightbox.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .28s cubic-bezier(.22,.61,.36,1),visibility 0s linear;
}
.lightbox img{
  max-width:100%;max-height:100%;border-radius:calc(var(--radius) - 2px);
  transform:scale(.94);transition:transform .28s cubic-bezier(.22,.61,.36,1);
}
.lightbox.open img{transform:scale(1)}

@media (min-width:600px){
  .wrap{padding-top:2rem}
  .card{padding:1.75rem 1.5rem}
  h2{font-size:1.6rem}
  h2.big{font-size:2.2rem}
}
@media (prefers-reduced-motion: reduce){
  .enter,.exit,.pill-row,.lane.new .node.ship{animation:none}
  .lightbox,.lightbox.open,.lightbox img,.lightbox.open img{transition:none}
}
</style>
</head>

const stage=document.getElementById('stage'), ticks=document.getElementById('ticks'),
      chapter=document.getElementById('chapter'), counter=document.getElementById('counter'),
      nextB=document.getElementById('next'), backB=document.getElementById('back'),
      lb=document.getElementById('lightbox'), lbImg=document.getElementById('lightimg');
const N=STEPS.length; let i=0;
const RESTART_ICON='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
const CHEV_LEFT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const CHEV_RIGHT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
let audioCtx;
function playClick(freq){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime, osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(freq,t);
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(.18,t+.008);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.09);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+.1);
  }catch(e){}
}
STEPS.forEach(()=>{const t=document.createElement('div');t.className='tick';ticks.appendChild(t)});
const T=[...ticks.children];
const reduce=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function paint(){
  const old=stage.firstElementChild;
  const put=()=>{
    stage.innerHTML=`<article class="card enter">${STEPS[i].html}</article>`;
    if(reduce())stage.querySelectorAll('video').forEach(v=>{v.removeAttribute('autoplay');v.pause()});
    window.scrollTo({top:0,behavior:reduce()?'auto':'smooth'});
  };
  if(old && !reduce()){old.classList.remove('enter');old.classList.add('exit');setTimeout(put,190)} else put();
  T.forEach((t,n)=>t.className='tick'+(n<i?' done':n===i?' now':''));
  chapter.textContent=STEPS[i].ch;
  counter.textContent=String(i+1).padStart(2,'0')+' / '+N;
  const last=i===N-1;
  backB.innerHTML=last?RESTART_ICON:CHEV_LEFT;
  backB.disabled=!last&&i===0;
  backB.setAttribute('aria-label',last?'Start over':'Back');
  nextB.disabled=false;
  nextB.classList.toggle('wide',last);
  nextB.innerHTML=last?'Submit':CHEV_RIGHT;
  nextB.classList.add('primary');
  nextB.setAttribute('aria-label',last?'Submit':(i===0?'Start':'Next'));
}
nextB.onclick=()=>{
  playClick(880);
  if(i===N-1){document.getElementById('interest').requestSubmit();return}
  i++;paint();
};
backB.onclick=()=>{
  playClick(560);
  if(i===N-1){i=0;paint();return}
  if(i>0){i--;paint()}
};
document.addEventListener('keydown',ev=>{
  if(lb.classList.contains('open')){if(ev.key==='Escape')closeLb();return}
  if(ev.target.closest&&ev.target.closest('input,textarea,select'))return;
  if(ev.key==='ArrowRight')nextB.click();
  if(ev.key==='ArrowLeft'&&!backB.disabled)backB.click();
});
stage.addEventListener('click',ev=>{
  const b=ev.target.closest('.shot'); if(!b)return;
  lbImg.src=b.dataset.src; lbImg.alt=b.querySelector('img').alt;
  lb.classList.add('open'); lb.focus();
});
function closeLb(){lb.classList.remove('open')}
lb.onclick=closeLb;

/* form */
const money=(n,c)=>c==='USD'?'$'+Number(n).toLocaleString('en-US'):'₹'+Number(n).toLocaleString('en-IN');
stage.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.name==='currency'){
    const usd=t.value==='USD', p=document.getElementById('f-price');
    document.getElementById('f-sym').textContent=usd?'$':'₹';
    p.placeholder=usd?'800':'50,000';
    const d=p.value.replace(/[^0-9]/g,''); if(d)p.value=Number(d).toLocaleString(usd?'en-US':'en-IN');
  }
  if(t.id==='f-rel'){
    document.getElementById('f-rel-out').innerHTML=t.value+'<span class="of">/10</span>';
    t.style.setProperty('--p',(t.value/10*100)+'%');
  }
  if(t.id==='f-price'){
    const cur=document.querySelector('input[name=currency]:checked').value;
    const d=t.value.replace(/[^0-9]/g,'').slice(0,7);
    t.value=d?Number(d).toLocaleString(cur==='USD'?'en-US':'en-IN'):'';
  }
  if(t.id==='f-wa'){t.value=t.value.replace(/[^0-9+ ]/g,'')}
  if(t.getAttribute('aria-invalid')==='true'){t.removeAttribute('aria-invalid');const e=document.getElementById('e-'+t.id.slice(2));if(e)e.textContent=''}
});
async function saveResponse(row){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY) return;               // demo mode
  const headers={'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'return=minimal'};
  if(!SUPABASE_ANON_KEY.startsWith('sb_')) headers['Authorization']='Bearer '+SUPABASE_ANON_KEY; // legacy anon JWT
  const res=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+SUPABASE_TABLE,{method:'POST',headers,body:JSON.stringify(row)});
  if(!res.ok) throw new Error('save_failed_'+res.status);
}

stage.addEventListener('submit',async ev=>{
  ev.preventDefault();
  const f=ev.target, name=f.name.value.trim(), email=f.email.value.trim(), wa=f.whatsapp.value.trim(),
        cur=f.currency.value, price=f.price.value.replace(/[^0-9]/g,''),
        relevance=Number(f.relevance.value), missing=f.missing.value.trim();
  const digits=wa.replace(/[^0-9]/g,'');
  const checks=[
    ['name',!name,'Enter your name'],
    ['email',!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email),'Enter a valid email, like you@example.com'],
    ['wa',digits.length<8||digits.length>15,'Enter your WhatsApp number with country code, like +91 98765 43210'],
    ['rel',relevance<1,'Move the slider to rate it from 1 to 10'],
    ['price',!price||Number(price)<=0||(cur==='INR'&&Number(price)<15000),cur==='INR'&&price&&Number(price)<15000?'Minimum price is ₹15,000':'Enter a price']
  ];
  let first=null;
  checks.forEach(([k,bad,msg])=>{
    const inp=document.getElementById('f-'+k), er=document.getElementById('e-'+k);
    if(bad){inp.setAttribute('aria-invalid','true');er.textContent=msg;first=first||inp}
    else{inp.removeAttribute('aria-invalid');er.textContent=''}
  });
  if(first){first.focus();return}

  const formErr=document.getElementById('e-form'), btn=nextB;
  formErr.textContent='';
  const showThanks=()=>{document.getElementById('formwrap').innerHTML=`<div class="thanks">
    <p class="kicker">Got it</p>
    <h2>Thanks, ${e(name.split(' ')[0])}.</h2>
    <p class="soft">You said ${money(price,cur)} feels right. I'll reach out on WhatsApp at ${e(wa)} or at ${e(email)} before the cohort opens.</p>
  </div>`;btn.disabled=true;btn.textContent='Sent';};

  if(f.company.value){showThanks();return}                      // bot filled the hidden field

  btn.disabled=true; btn.textContent='Sending…';
  try{
    await saveResponse({name,email,whatsapp:wa,relevance,currency:cur,price:Number(price),missing:missing||null});
    showThanks();
  }catch(err){
    btn.disabled=false; btn.textContent='Submit';
    formErr.textContent="Couldn't send that. Check your connection and try again.";
  }
});

/* swipe */
let sx=null;
stage.addEventListener('touchstart',ev=>{sx=ev.target.closest('input,textarea,select')?null:ev.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',ev=>{
  if(sx===null)return; const dx=ev.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)<60)return;
  if(dx<0&&i<N-1){i++;paint()} else if(dx>0&&i>0){i--;paint()}
},{passive:true});

paint();
</script>
