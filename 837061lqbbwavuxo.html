<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Interest — Admin</title>
<style>
  :root{
    --bg:#0b0c10;--card:#15171c;--border:#2a2d35;--fg:#f4f4f5;--muted:#9a9ba3;
    --accent:#f4f4f5;--accent-fg:#0b0c10;--danger:#f87171;
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    font-size:15px;line-height:1.5;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:2rem 1.25rem 4rem}

  /* login */
  .login{max-width:340px;margin:14vh auto 0;display:flex;flex-direction:column;gap:.9rem}
  .login h1{font-size:1.1rem;margin:0 0 .2rem}
  .login p{color:var(--muted);font-size:.85rem;margin:0 0 .5rem}
  label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:.3rem}
  input{
    width:100%;padding:.6rem .7rem;border-radius:8px;border:1px solid var(--border);
    background:#0f1014;color:var(--fg);font-size:.9rem;
  }
  input:focus{outline:none;border-color:#565b66}
  button{
    font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);
    background:var(--accent);color:var(--accent-fg);padding:.65rem 1rem;font-weight:600;font-size:.88rem;
  }
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--fg)}
  .err{color:var(--danger);font-size:.82rem;min-height:1.1em}

  /* app */
  .top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
  .top h1{font-size:1.2rem;margin:0}
  .conv{display:block;font-size:.72rem;font-weight:500;color:var(--muted)}
  .cur{font-size:.72rem;font-weight:600;padding:.15rem .45rem;border-radius:5px;border:1px solid var(--border);color:var(--muted)}
  .src{font-size:.72rem;font-weight:600;padding:.15rem .45rem;border-radius:5px;border:1px solid var(--border);color:var(--muted)}
  .src.roast{border-color:hsl(4 80% 60% / .45);color:hsl(4 90% 70%);background:hsl(4 80% 55% / .1)}
  .meta{color:var(--muted);font-size:.82rem}

  .stats{display:flex;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap}
  .stat{
    flex:1;min-width:170px;border:1px solid var(--border);border-radius:10px;
    padding:.9rem 1rem;background:var(--card);display:flex;flex-direction:column;gap:.3rem;
  }
  .stat-label{font-size:.75rem;color:var(--muted);font-weight:500}
  .stat-value{display:flex;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;height:1.15em;overflow:hidden}
  .dg{display:inline-block;height:1.15em;overflow:hidden}
  .dg-col{display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.22,.61,.36,1)}
  .dg-col span{display:block;height:1.15em}
  tbody tr.moving{position:relative;z-index:1;background:var(--bg)}
  @media (prefers-reduced-motion: reduce){.dg-col{transition:none}}

  .tablewrap{border:1px solid var(--border);border-radius:8px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:820px}
  th,td{text-align:left;padding:.65rem .9rem;white-space:nowrap}
  thead tr{border-bottom:1px solid var(--border)}
  th{font-size:.78rem;font-weight:500;color:var(--muted)}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--fg)}
  th.sortable.active{color:var(--fg)}
  .sort-ico{display:inline-block;margin-left:.3rem;opacity:.6;font-size:.7em}
  tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:hsl(0 0% 100% / .035)}
  td.price{font-weight:600;font-variant-numeric:tabular-nums}
  td.wrap-cell{white-space:normal;max-width:280px;vertical-align:top}
  .clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
  .clamp.expanded{-webkit-line-clamp:unset;display:block}
  .show-more{
    display:inline-block;margin-top:.25rem;border:none;background:none;cursor:pointer;
    color:var(--muted);font:inherit;font-size:.76rem;font-weight:600;padding:0;text-decoration:underline;
  }
  .show-more:hover{color:var(--fg)}
  .rel{display:inline-flex;align-items:center;gap:.4rem;font-variant-numeric:tabular-nums}
  .rel-bar{width:40px;height:4px;border-radius:99px;background:var(--border);overflow:hidden}
  .rel-bar span{display:block;height:100%;background:var(--fg)}
  .status-chip{
    border:none;border-radius:999px;padding:.32rem .8rem;font:inherit;font-size:.78rem;font-weight:600;
    cursor:pointer;appearance:none;-webkit-appearance:none;-moz-appearance:none;
  }
  .status-chip:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
  .status-chip.status-no_action{background-color:hsl(0 0% 100% / .08);color:var(--muted)}
  .status-chip.status-in_funnel{background-color:hsl(32 90% 55% / .18);color:hsl(32 95% 68%)}
  .status-chip.status-paid{background-color:hsl(152 55% 45% / .18);color:hsl(152 65% 62%)}
  .status-chip.status-not_fit{background-color:hsl(0 72% 55% / .18);color:hsl(0 85% 72%)}
  .empty{padding:3rem 1rem;text-align:center;color:var(--muted)}
  a.mail,a.wa{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
  .copyable{display:inline-flex;align-items:center;gap:.35rem}
  .copy{
    display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;
    border:none;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;
  }
  .copy:hover{background:hsl(0 0% 100% / .08);color:var(--fg)}
  .copy:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
  .copy.done{color:hsl(152 65% 62%)}
  .copy svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  @media (min-width:900px){
    .status-cell{position:sticky;right:0;z-index:2;background:var(--bg);box-shadow:inset 1px 0 0 var(--border)}
    tbody tr:hover .status-cell{background:color-mix(in srgb,var(--bg),#fff 3.5%)}
  }
</style>
</head>
<body>

<div id="login-view" class="wrap login" hidden>
  <h1>Sign in</h1>
  <p>Restricted to authorized accounts only.</p>
  <div>
    <label for="li-email">Email</label>
    <input id="li-email" type="email" autocomplete="username">
  </div>
  <div>
    <label for="li-pass">Password</label>
    <input id="li-pass" type="password" autocomplete="current-password">
  </div>
  <span class="err" id="li-err"></span>
  <button id="li-submit">Sign in</button>
</div>

<div id="app-view" class="wrap" hidden>
  <div class="top">
    <h1>Course interest</h1>
    <div style="display:flex;align-items:center;gap:.8rem">
      <button class="ghost" id="download">Download CSV</button>
      <button class="ghost" id="logout">Log out</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat">
      <span class="stat-label">Total earned</span>
      <span class="stat-value" id="stat-earned">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Total promise</span>
      <span class="stat-value" id="stat-promise">—</span>
    </div>
  </div>
  <p class="meta" id="meta"></p>
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="price">Price<span class="sort-ico"></span></th><th class="sortable" data-sort="currency">Currency<span class="sort-ico"></span></th><th>Name</th><th>Email</th><th>WhatsApp</th><th class="sortable" data-sort="relevance">Relevance<span class="sort-ico"></span></th><th>Missing</th><th class="sortable" data-sort="created_at">Submitted<span class="sort-ico"></span></th><th class="sortable" data-sort="source">Source<span class="sort-ico"></span></th><th class="sortable status-cell" data-sort="status">Status<span class="sort-ico"></span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No submissions yet.</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://hfgqtwkfxhzuwbqrxxru.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZ3F0d2tmeGh6dXdicXJ4eHJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MDkwOTEsImV4cCI6MjEwNjA4NTA5MX0.xTVvFQZvaG4_59LnpN4NBD6_MuPiMmpSLB0S6_5Fjdw";
const SUPABASE_TABLE = "course_interest";

const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loginView = document.getElementById('login-view'), appView = document.getElementById('app-view');
const liEmail = document.getElementById('li-email'), liPass = document.getElementById('li-pass'),
      liErr = document.getElementById('li-err'), liSubmit = document.getElementById('li-submit');
const rowsEl = document.getElementById('rows'), emptyEl = document.getElementById('empty'), metaEl = document.getElementById('meta');
const USD_TO_INR = 95;
let session = null, rows = [], sortKey = 'price', sortDir = 'desc';
const inr = r => Number(r.price) * (r.currency === 'USD' ? USD_TO_INR : 1);

function getSession(){
  try{ return JSON.parse(sessionStorage.getItem('admin_session') || 'null'); }catch(e){ return null; }
}
function setSession(s){
  session = s;
  try{ sessionStorage.setItem('admin_session', JSON.stringify(s)); }catch(e){}
}
function clearSession(){
  session = null;
  try{ sessionStorage.removeItem('admin_session'); }catch(e){}
}

async function login(email, password){
  const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body:JSON.stringify({ email, password })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || 'Invalid email or password');
  return { access_token:data.access_token, email };
}

async function fetchRows(){
  const res = await fetch(
    SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE + '?select=*&order=price.desc',
    { headers:{ apikey:SUPABASE_ANON_KEY, Authorization:'Bearer ' + session.access_token } }
  );
  if(res.status === 401){ clearSession(); showLogin('Session expired, please sign in again.'); return null; }
  if(!res.ok) throw new Error('Could not load data (' + res.status + ')');
  return res.json();
}

function relevanceBar(n){
  const pct = Math.max(0, Math.min(10, n)) * 10;
  return `<span class="rel"><span class="rel-bar"><span style="width:${pct}%"></span></span>${e(n)}/10</span>`;
}

const STATUS_RANK = { no_action:0, in_funnel:1, paid:2, not_fit:3 };
function sortValue(r, key){
  if(key === 'created_at') return new Date(r.created_at).getTime();
  if(key === 'status') return STATUS_RANK[r.status] ?? 0;
  if(key === 'price') return inr(r);
  return r[key];
}

const COPY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const expanded = new Set();
let visible = [];
const STATUS_TEXT = { no_action:'No action', in_funnel:'In funnel', paid:'Paid', not_fit:'Not fit' };

function csvCell(v){
  let s = String(v ?? '');
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

function downloadCsv(){
  const head = ['Name','Email','WhatsApp','Currency','Price','Relevance','Status','Source','Missing','Submitted'];
  const lines = visible.map(r => [
    r.name, r.email, r.whatsapp, r.currency, r.price, r.relevance,
    STATUS_TEXT[r.status] || 'No action', r.source === 'roast' ? 'Roast page' : 'Main page', r.missing, r.created_at
  ].map(csvCell).join(','));
  const csv = '﻿' + [head.map(csvCell).join(','), ...lines].join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'course-interest-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function setRolling(el, text){
  el.setAttribute('aria-label', text);
  const chars = [...text], shape = chars.map(c => /\d/.test(c) ? 'd' : c).join('');
  if(el.dataset.shape !== shape){
    el.dataset.shape = shape;
    el.innerHTML = chars.map(c => /\d/.test(c)
      ? `<span class="dg" aria-hidden="true"><span class="dg-col">${'0123456789'.split('').map(n => `<span>${n}</span>`).join('')}</span></span>`
      : `<span class="sep" aria-hidden="true">${c}</span>`).join('');
    el.offsetHeight;
  }
  const cols = el.querySelectorAll('.dg-col');
  chars.filter(c => /\d/.test(c)).forEach((d, n) => { cols[n].style.transform = `translateY(${-Number(d) * 1.15}em)`; });
}

function render(){
  const before = new Map();
  rowsEl.querySelectorAll('tr[data-id]').forEach(tr => before.set(tr.dataset.id, tr.getBoundingClientRect().top));
  const filtered = visible = rows.slice();
  filtered.sort((a, b) => {
    const notFitA = a.status === 'not_fit', notFitB = b.status === 'not_fit';
    if(notFitA !== notFitB) return notFitA ? 1 : -1;
    const va = sortValue(a, sortKey), vb = sortValue(b, sortKey), dir = sortDir === 'asc' ? 1 : -1;
    if(typeof va === 'string') return va.localeCompare(vb) * dir || inr(b) - inr(a);
    return (va - vb) * dir;
  });
  document.querySelectorAll('th.sortable').forEach(th => {
    const active = th.dataset.sort === sortKey;
    th.classList.toggle('active', active);
    th.querySelector('.sort-ico').textContent = active ? (sortDir === 'asc' ? '▲' : '▼') : '';
  });
  const sumBy = status => Math.round(filtered.filter(r => r.status === status).reduce((s, r) => s + inr(r), 0));
  setRolling(document.getElementById('stat-earned'), '₹' + sumBy('paid').toLocaleString('en-IN'));
  setRolling(document.getElementById('stat-promise'), '₹' + sumBy('in_funnel').toLocaleString('en-IN'));
  rowsEl.innerHTML = filtered.map(r => `
    <tr data-id="${e(r.id)}">
      <td class="price">${r.currency === 'USD' ? '$' + Number(r.price).toLocaleString('en-US') + `<span class="conv">≈ ₹${Math.round(inr(r)).toLocaleString('en-IN')}</span>` : '₹' + Number(r.price).toLocaleString('en-IN')}</td>
      <td><span class="cur">${e(r.currency)}</span></td>
      <td>${e(r.name)}</td>
      <td><span class="copyable"><a class="mail" href="mailto:${e(r.email)}">${e(r.email)}</a><button class="copy" type="button" data-copy="${e(r.email)}" aria-label="Copy email" title="Copy email">${COPY_ICON}</button></span></td>
      <td><span class="copyable"><a class="wa" href="https://wa.me/${e(String(r.whatsapp).replace(/[^0-9]/g,''))}" target="_blank" rel="noopener">${e(r.whatsapp)}</a><button class="copy" type="button" data-copy="${e(r.whatsapp)}" aria-label="Copy WhatsApp number" title="Copy number">${COPY_ICON}</button></span></td>
      <td>${relevanceBar(r.relevance)}</td>
      <td class="wrap-cell">${r.missing ? `<div class="clamp${expanded.has(r.id) ? ' expanded' : ''}">${e(r.missing)}</div><button class="show-more" type="button">${expanded.has(r.id) ? 'Show less' : 'Show more'}</button>` : '—'}</td>
      <td>${new Date(r.created_at).toLocaleDateString()}</td>
      <td><span class="src${r.source === 'roast' ? ' roast' : ''}">${r.source === 'roast' ? 'Roast page' : 'Main page'}</span></td>
      <td class="status-cell">
        <select class="status-chip status-${r.status || 'no_action'}" data-id="${e(r.id)}">
          <option value="no_action"${r.status === 'no_action' || !r.status ? ' selected' : ''}>No action</option>
          <option value="in_funnel"${r.status === 'in_funnel' ? ' selected' : ''}>In funnel</option>
          <option value="paid"${r.status === 'paid' ? ' selected' : ''}>Paid</option>
          <option value="not_fit"${r.status === 'not_fit' ? ' selected' : ''}>Not fit</option>
        </select>
      </td>
    </tr>
  `).join('');
  emptyEl.hidden = filtered.length !== 0;
  const usdCount = filtered.filter(r => r.currency === 'USD').length;
  metaEl.textContent = filtered.length + ' submission' + (filtered.length === 1 ? '' : 's')
    + ' · ' + (filtered.length - usdCount) + ' INR, ' + usdCount + ' USD · totals use $1 = ₹' + USD_TO_INR;
  rowsEl.querySelectorAll('.clamp:not(.expanded)').forEach(c => {
    if(c.scrollHeight <= c.clientHeight + 1) c.nextElementSibling.hidden = true;
  });
  if(!before.size || reduceMotion()) return;
  rowsEl.querySelectorAll('tr[data-id]').forEach(tr => {
    const old = before.get(tr.dataset.id);
    if(old == null) return;
    const dy = old - tr.getBoundingClientRect().top;
    if(Math.abs(dy) < 1) return;
    tr.classList.add('moving');
    tr.style.transition = 'none';
    tr.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      tr.style.transition = 'transform .5s cubic-bezier(.22,.61,.36,1)';
      tr.style.transform = '';
      tr.addEventListener('transitionend', () => { tr.classList.remove('moving'); tr.style.transition = ''; }, { once:true });
    }));
  });
}

async function updateStatus(id, status){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE + '?id=eq.' + id, {
    method:'PATCH',
    headers:{
      apikey:SUPABASE_ANON_KEY, Authorization:'Bearer ' + session.access_token,
      'Content-Type':'application/json', Prefer:'return=minimal'
    },
    body:JSON.stringify({ status })
  });
  if(!res.ok) throw new Error('save_failed');
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    ta.remove();
  }
}

rowsEl.addEventListener('click', async ev => {
  const copyBtn = ev.target.closest('.copy');
  if(copyBtn){
    await copyText(copyBtn.dataset.copy);
    copyBtn.innerHTML = CHECK_ICON;
    copyBtn.classList.add('done');
    clearTimeout(copyBtn._t);
    copyBtn._t = setTimeout(() => { copyBtn.innerHTML = COPY_ICON; copyBtn.classList.remove('done'); }, 1200);
    return;
  }
  const btn = ev.target.closest('.show-more');
  if(!btn) return;
  const id = btn.closest('tr').dataset.id;
  const isOpen = btn.previousElementSibling.classList.toggle('expanded');
  isOpen ? expanded.add(id) : expanded.delete(id);
  btn.textContent = isOpen ? 'Show less' : 'Show more';
});

rowsEl.addEventListener('change', async ev => {
  const sel = ev.target.closest('select.status-chip');
  if(!sel) return;
  const row = rows.find(r => r.id === sel.dataset.id);
  if(!row) return;
  const prev = row.status || 'no_action', status = sel.value;
  row.status = status;
  render();
  try{
    await updateStatus(row.id, status);
  }catch(err){
    row.status = prev;
    render();
    metaEl.textContent = "Couldn't save that change. Check your connection and try again.";
  }
});

async function showApp(){
  loginView.hidden = true; appView.hidden = false;
  try{
    const data = await fetchRows();
    if(data === null) return;
    rows = data;
    render();
  }catch(err){
    metaEl.textContent = err.message;
  }
}

function showLogin(msg){
  appView.hidden = true; loginView.hidden = false;
  liErr.textContent = msg || '';
  liEmail.focus();
}

document.getElementById('logout').addEventListener('click', () => { clearSession(); showLogin(); });
document.getElementById('download').addEventListener('click', downloadCsv);

document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    sortDir = (sortKey === key && sortDir === 'desc') ? 'asc' : 'desc';
    sortKey = key;
    render();
  });
});

liSubmit.addEventListener('click', async () => {
  liErr.textContent = '';
  const email = liEmail.value.trim(), password = liPass.value;
  if(!email || !password){ liErr.textContent = 'Enter email and password'; return; }
  liSubmit.disabled = true; liSubmit.textContent = 'Signing in…';
  try{
    const s = await login(email, password);
    setSession(s);
    await showApp();
  }catch(err){
    liErr.textContent = err.message;
  }finally{
    liSubmit.disabled = false; liSubmit.textContent = 'Sign in';
  }
});
[liEmail, liPass].forEach(inp => inp.addEventListener('keydown', ev => { if(ev.key === 'Enter') liSubmit.click(); }));

const existing = getSession();
if(existing){ session = existing; showApp(); } else { showLogin(); }
</script>
</body>
</html>
